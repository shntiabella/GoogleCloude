<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script> 
    <!--kalo mau costume warna dll diletak disini, ex <script>-->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue:'#abdbe3',
                        yellow:'#',
                    },
                },
            },
        }

    </script>
</head>

<!-- flex col untuk membuat list kebawah, kalo ga ada flex-col maka dia akan kesamping-->
<body class="flex min-h-screen flex-col bg-blue">
   <header class=" sticky top-0 border-b border-slate-200 bg-white">
        <nav class="mx-auto max--w-6xl px-6 lg:px-10">     
            <div  class="flex h-16 items-center justify-between">
                <!-- logo -->
             <a class="flex items-center gap-3">
                    <img 
                        src="img/logo.png"
                        alt="Logo"
                        class="h-10 w-12 object-contain"
                    >
                <span class="text-lg font-semibold text-slate-900">Belajar Tailwind</span>
             </a>
             <a herf="#" class="text-lg font-semibold text-slate-900">Belajar Tailwind</a>
                <!-- menu desktop -->
                <div class="hidden items-center gap-8 md:flex">
                    <a class="font-medium text-slate-700 transistion hover:text-blue-700">Tentang</a>
                    <a class="font-medium text-slate-700 transistion hover:text-blue-700">Beranda</a>
                    <a class="font-medium text-slate-700 transistion hover:text-blue-700">Kontak</a>

                </div>


                <!-- menu mobile -->
                <button id="menuButton" type="button" aria-label="Buka Menu Navigasi" aria-expended="false"
                     class="rounded-lg p-2 text-state-700 transtition hover: bg-slate-200 md:hidden">
                <!-- Hamburger icon -->
                  <svg id="hamburgerIcon" xmlns="https://www/w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroker-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m6 18 18 6l12 12"/>
                 </svg>

                 <!-- close icon -->
                 <svg id="closeIcon" xmlns="https://www/w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroker-width="2">
                     <path stroke-linecap="round" stroke-linejoin="round" d="m6 18 18 6l12 12"/>
                 </svg>
                 
                </button>

            </div>

        </nav>
           
    </header>
    
    <p class="font-bold text-center text-red-500 text-4xl">ini halaman tailwindcss</p>
    <p class="font-bold text-red-500 text-4xl text-center">ini halaman tailwindcss</p>
    <p class="font-bold text-red-500 text-center text-4xl">ini halaman tailwindcss</p>

    <footer id="footer" class="bg-slate-800 text-slate-300">
        <div class="mx-auto flex max-w-6xl flex-cool gap-4 px-6 py-6
            text-center sm:flex-row sm:items-center
            sm: justify-between sm: text-left lg: px-10">

            <p class="text-sm">
                &copy: 2024 Belajar Tailwind, All right reserved.
            </p>
        </div>

        <div class="flex justify-center gap-5 text-sm">
            <a class="transition hover: text-blue-700"> Beranda</a>
            <a class="transition hover: text-blue-700"> Tentang</a>
            <a class="transition hover: text-blue-700"> Kontak</a>

        </div>

    </footer>

    <script>
        const menuButton = document.getElementById('menuButton');
        const mobileMenu = document.getElementById('mobileMenu');
        const hamburgerIcon = document.getElementById('hamburgerIcon');
        const closeIcon = document.getElementById('closeIcon');
        const mobileLinks = mobileMenu.querySelectorALL('.mobile-link');

        function closeMobileMenu() {
            mobileMenu.classList.add('hidden');
            hamburgerIcon.classList.remove('hidden');
            closeIcon.classList.add('hidden');
            menuButton.setAttribute('aria-expanded', 'false');
        }

        menuButton.addEventListener('click', function() {
            const isClosed = mobileMenu.classList.contains('hidden');

            mobileMenu.classList.toggle('hidden');
            hamburgerIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
            menuButton.setAttribute('aria-expanded', isClosed ? 'true' : 'false');
        });

        mobileLinks.forEach(Link => {
            link.addEventListener('click', closeMobileMenu);
        });
    
    </script>
    
</body>
</html>
