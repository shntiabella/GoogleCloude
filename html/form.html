<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<!--css-->
<!--body: semua element yang ada di bpdy diatur dalam aturan css disini-->
    <style>
        .form-card{
            width: min(100%, 620px);
            padding: 32px;   
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #1f2937;
            background: #f3f7f2;
            font-family: Arial, sans-serif;
        }

        label {
            display: block;
            margin-bottom: 7px; 
            font-size: 12px;
            font-weight: 600; 
        }

        input, select, textarea{
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #f3f7f2;
            border-radius: 7px;
            background: #f3f7f2;
        }

        h1{
            font-size: 26px;
        }
    </style>
</head>

<!--html-->
<body>
 <main class="form-card">
    <form id="inputForm">
        <div class="form-group">
            <label for="nama">Nama <span class="required">*</span></label>
            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Mauskan nama"
                autocomplate="name"
                required
            >
        </div>

<!--option untuk membuat opsi yang bisa dipilih-->
        <div class="form-group">
            <label for="kategori">Kategori <span class="required">*</span></label>
            <select id="katagori" name="katagori" required>
                <option value="" selected disable>Pilih katagori</option>
                <option value="Annual">Annual</option>
                <option value="Monthly">Monthly</option>
                <option value="Lainnya">Lainnya</option>
            </select>
        </div>

<!-- textarea untuk desc yang banyak supaya tidak memanjang kesamping-->
        <div class="form-group">
            <label for="keterangan">Keterangan <span class="required">*</span></label>
            <textarea
                id="keterangan"
                name="keterangan"
                placeholder="Tulis keterangan"
                required
            ></textarea>
        </div>
<!--untuk membuat tanggal/opsitanggal-->
        <div class="form-group">
             <label for="tanggal">Tanggal <span class="required">*</span></label>
             <input type="date" id="tanggal" name="tanggal" required>
        </div>
<!--untuk memasukan file-->
        <div>
            <label for="gambar">Gambar <span class="required">*</span></label>
             <input type="file" id="gambar" name="gambar" accept="image/jpeg, image/png" required>
        </div>


        <button type="submit">Kirim Data</button>
    </form>
    <section id="result" class="result" aria-live="polite">
        <h1>Hasil Input</h1>
        <p><strong>Nama:</strong></p>
        <p><strong>Katagori:</strong></p>
        <p><strong>Keterangan:</strong></p>
        <p><strong>Tanggal:</strong></p>
    </section>
 </main>

</html>
